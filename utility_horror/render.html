const UA={

  red:'#FA5151', green:'#07C160', orange:'#FF9C07', dim:'#7d8894'

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const blink=(t,p=1)=>(t%p)<p/2;
function rng(seed){let s=seed>>>0;return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296);}

const IMGS={};let imgLoaded=0,imgNeed=0;
if(window.PHOTOS){for(const k in PHOTOS){imgNeed++;const im=new Image();im.onload=()=>{imgLoaded++;};im.src=PHOTOS[k];IMGS[k]=im;}}
function img(k){const im=IMGS[k];return (im&&im.complete&&im.naturalWidth)?im:null;}

function txt(s,x,y,size=16,color='#111',align='left',weight='400',font='sans'){
  ctx.save();
  const fam=font==='sans'?'"Microsoft YaHei","PingFang SC",sans-serif':'"Consolas","Courier New","Microsoft YaHei",monospace';
  ctx.font=weight+' '+size+'px '+fam;
  ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';
  ctx.fillText(s,x,y);ctx.restore();
}
function rrect(x,y,w,h,r,fill,stroke){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function line2(x1,y1,x2,y2,color='#E3E9EF',lw=1){
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke();
}
function imgCover(k,x,y,w,h,r=8,tag){
  const im=img(k);
  rrect(x,y,w,h,r,'#101418');
  if(im){
    const iw=im.naturalWidth,ih=im.naturalHeight;
    const s=Math.max(w/iw,h/ih),dw=iw*s,dh=ih*s;
    ctx.save();rrect(x,y,w,h,r);ctx.clip();
    ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);ctx.restore();
  }
  if(tag){rrect(x+10,y+h-30,tag.w,22,4,'rgba(0,0,0,.62)');txt(tag.s,x+10+tag.w/2,y+h-14,12,'#fff','center','500');}
}
function drawAvatarBox(x,y,s,color,label){
  rrect(x,y,s,s,6,color);
  txt(label,x+s/2,y+s/2+s*0.32,Math.floor(s*0.5),'#fff','center','700','sans');
}
function statusBar(t){

function tabbar(active){

function notifCard(y,t,title,body,appName,color){

  txt(appName,96,yy+28,13,'#8a919a','left','600');
  txt(title,96,yy+50,15,'#111','left','600');
  const lines=body.length>24?[body.slice(0,24),body.slice(24,48)]:[body];
  lines.forEach((l,i)=>txt(l,96,yy+70+i*18,12,'#5b6470'));
  txt('现在',500,yy+26,11,'#a5adb5','right');
  ctx.restore();
}

function wrapChat(text,maxW){
  ctx.save();ctx.font='400 16px "Microsoft YaHei",sans-serif';
  const lines=[];let cur='';
  for(const ch of text){
    if(ctx.measureText(cur+ch).width>maxW){lines.push(cur);cur=ch;}else cur+=ch;
  }
  if(cur)lines.push(cur);ctx.restore();
  return lines;
}
function pageChat(){
  ctx.fillStyle=UA.chatbg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#FFF';ctx.fillRect(0,0,W,104);
  line2(0,104,W,104,'#D9D9D9');

  let y=TOP+10;
  const rows=[];
  for(const m of CHAT){
    if(m.at>tGlobal)break;
    const a=clamp((tGlobal-m.at)/0.28,0,1);
    if(m.who==='sys'){rows.push({m,y,h:30,a});y+=44;continue;}
    const lines=wrapChat(m.text,300);

    rows.push({m,y,h:bh+(m.who==='cs'?0:0),a,lines});

  // typing
  const typingWin=[[27.9,28.6]];
  let ty=y;
  const off=Math.max(0,y-BOT+16);
  ctx.save();ctx.beginPath();ctx.rect(0,TOP-6,W,BOT-TOP+8);ctx.clip();
  for(const r of rows){
    const sy=r.y-off;const m=r.m;
    ctx.save();ctx.globalAlpha=r.a;
    const dy=(1-ease(r.a))*12;
    if(m.who==='sys'){
      rrect(W/2-150,sy+dy,300,26,4,'rgba(0,0,0,.05)');
      txt(m.text,W/2,sy+dy+18,12,UA.sys,'center');
    }else if(m.who==='me'){
      const bw=Math.min(316,Math.max(...r.lines.map(l=>{ctx.save();ctx.font='400 16px "Microsoft YaHei",sans-serif';const w=ctx.measureText(l).width;ctx.restore();return w;}))+26);
      drawAvatarBox(480,sy+dy,40,UA.mine,'我');
      rrect(468-bw,sy+dy,bw,r.h,6,UA.mine);
      r.lines.forEach((l,i)=>txt(l,468-bw+13,sy+dy+24+i*25,16,'#111'));
    }else{
      drawAvatarBox(20,sy+dy,40,UA.brand,'物');
      const bw=Math.min(316,Math.max(...r.lines.map(l=>{ctx.save();ctx.font='400 16px "Microsoft YaHei",sans-serif';const w=ctx.measureText(l).width;ctx.restore();return w;}))+26);
      rrect(72,sy+dy,bw,r.h,6,UA.other);
      r.lines.forEach((l,i)=>txt(l,85,sy+dy+24+i*25,16,'#111'));
    }
    ctx.restore();
  }
  for(const [a,b] of typingWin){
    if(tGlobal>a&&tGlobal<b){
      drawAvatarBox(20,BOT-84,40,UA.brand,'物');
      rrect(72,BOT-84,74,44,6,UA.other);
      for(let i=0;i<3;i++){
        ctx.globalAlpha=(Math.floor(tGlobal*3)%3)===i?1:.3;
        ctx.beginPath();ctx.arc(92+i*20,BOT-62,4,0,7);ctx.fillStyle='#B4B4B4';ctx.fill();
      }
      ctx.globalAlpha=1;
    }
  }
  ctx.restore();
  // input bar
  ctx.fillStyle='#F7F7F7';ctx.fillRect(0,H-64,W,64);
  line2(0,H-64,W,H-64,'#D9D9D9');

}

  pageLock();
  notifCard(320,tGlobal-40.9,'现场照片（2）','定位：恒安公寓1203 · 服务已送达','物业管家',UA.brand);
  notifCard(430,tGlobal-41.7,'用水异常已解除','经复核，该户用水人数：4 · 感谢您的理解','城南智慧物业',UA.brand);
  notifCard(540,tGlobal-42.5,'水表读数已更新','SB-0417 · 0472 · 用水速率 0.4 L/min','城南智慧物业',UA.brand);
}

/* ============ page manager ============ */
let tGlobal=0;
const PAGES=[
  {fn:pageLock,t:0},
  {fn:pageHome,t:3.2},
  {fn:pageTickets,t:10.2},
  {fn:pageChat,t:17.8},
  {fn:pageReview,t:27.2},
  {fn:pageDoor,t:34.6},
  {fn:pageLock2,t:41.0}
];
function drawPages(t){
  let i=0;
  for(let k=0;k<PAGES.length;k++)if(t>=PAGES[k].t)i=k;
  const cur=PAGES[i];
  const p=clamp((t-cur.t)/0.38,0,1);
  if(p<1&&i>0){
    const prev=PAGES[i-1];
    ctx.save();ctx.translate(-W*ease(p),0);prev.fn();ctx.restore();
    ctx.save();ctx.translate(W*(1-ease(p)),0);cur.fn();ctx.restore();
  }else cur.fn();
}
function grain(seed){
  const r=rng(seed);ctx.save();ctx.globalAlpha=.02;
  for(let i=0;i<120;i++){ctx.fillStyle=r()>.5?'#000':'#fff';ctx.fillRect(r()*W,r()*H,1+r()*40,1);}
  ctx.restore();
}
function glitch(t,s){
  if(s<=0)return;
  const r=rng(Math.floor(t*40)*71+3),n=Math.floor(s*6);
  for(let i=0;i<n;i++){
    const y=r()*H,h=2+r()*10,dx=(r()-.5)*30*s;
    try{ctx.drawImage(c,0,y,W,h,dx,y,W,h);}catch(e){}
  }
}
function draw(t){
  tGlobal=clamp(t,0,44.98);
  drawPages(tGlobal);
  grain(Math.floor(t*15)+1);
  const g=(t>=23.0&&t<23.3)?0.4:(t>=31.5&&t<31.8)?0.3:(t>=34.8&&t<35.1)?0.4:(t>=42.5&&t<42.8)?0.45:0;
  glitch(t,g);
  if(t>43.0){
    const a=clamp((t-43.0)/.5,0,1);
    ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.restore();
  }
  if(t>43.7){
    const a=clamp((t-43.7)/.35,0,1);
    ctx.save();ctx.globalAlpha=a;
    txt('幸福路 7 号 · 空置 14 个月',W/2,398,15,UA.sys,'center','500');
    if(t>44.1)txt('本周用水：18 吨',W/2,436,15,UA.sys,'center','500');
    if(t>44.4)txt('6 副碗筷，都还湿着。',W/2,486,24,'#ffffff','center','700');
    ctx.restore();
  }
}
window.seek=x=>draw(x);
if(imgNeed>0&&imgLoaded>=imgNeed)window.__ready=true;
else{const iv=setInterval(()=>{if(imgLoaded>=imgNeed){window.__ready=true;clearInterval(iv);}},80);}
if(!CAPTURE){
  const t0=performance.now();
  (function loop(now){draw(((now-t0)/1000)%45);requestAnimationFrame(loop);})(t0);
}
</script>
